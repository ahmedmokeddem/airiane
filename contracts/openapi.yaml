          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              question_id:
                type: string
                minLength: 1
                maxLength: 80
              wording:
                type: string
                minLength: 1
                maxLength: 500
              value:
                type: integer
              label:
                type: string
                minLength: 1
                maxLength: 80
              scored:
                type: boolean
            required:
            - question_id
            - wording
            - value
            - label
            - scored
