      - assessment_response_id
      - assessment_id
      - assessment_version
      - source_id
      - complete
      - title
      - answers
      - observed_at
    AssessmentResult:
      type: object
      additionalProperties: false
      description: Screening information for a clinician; not a diagnosis.
      properties:
        instrument:
          type: string
          enum:
          - phq9
          - bdi_themes
        total:
          type: integer
          minimum: 0
        max_total:
          type: integer
          minimum: 1
        level: &id010
          type: string
          enum:
          - low
          - mild
          - moderate
          - high
        severity:
          type: string
          minLength: 1
          maxLength: 160
        suggested_action:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 300
          - type: 'null'
        interpretation:
          type: string
          minLength: 1
          maxLength: 600
        patient_next_step:
          description: Sheet2's suggested action, worded for the patient.
          type: string
          minLength: 1
          maxLength: 300
        bands:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              min:
                type: integer
              max:
                type: integer
              level: *id010
              label:
                type: string
                minLength: 1
                maxLength: 160
            required:
            - min
            - max
            - level
            - label
          maxItems: 6
        functional_impairment:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 80
          - type: 'null'
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 80
              description:
                type: string
                minLength: 1
                maxLength: 200
              questions:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 10
                maxItems: 30
              score:
                type: integer
                minimum: 0
              max:
                type: integer
                minimum: 1
            required:
            - name
            - description
            - questions
            - score
            - max
          maxItems: 10
        safety:
          type: object
          additionalProperties: false
          properties:
            item_positive:
              type: boolean
            follow_up:
              anyOf:
              - type: string
                enum:
                - 'no'
                - 'yes'
                - declined
              - type: 'null'
          required:
          - item_positive
          - follow_up
        validated:
          type: boolean
        note:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - instrument
      - total
      - max_total
      - level
      - severity
      - suggested_action
      - interpretation
      - bands
      - functional_impairment
      - domains
      - safety
      - validated
      - note
    ReportRequest:
      type: object
      additionalProperties: false
      properties:
