openapi: 3.1.0
info:
  title: RE:SONANCE planned API
  version: 2.0.0
  description: Pre-implementation phased contract v2. V1 ElevenAgents voice and separate
    text; camera is strictly on-device preview. GeminiLiveAdapter is future V2 only
    and has no V1 credential/API dependency. Supabase identity, FastAPI authority,
    consent and factual JSON reports unchanged.
servers:
- url: https://api.example.invalid
  description: Reserved placeholder, not deployed
security:
- supabaseJWT: []
paths:
  /v1/me/onboarding:
    post:
      operationId: onboardPatient
      summary: onboardPatient
      description: See x-permission and shared semantic rules in docs/API_CONTRACTS.md.
      security:
      - supabaseJWT: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
        description: Actor+method+canonical path+key, canonical request hash; retain
          non-secret outcomes 24h (demo assumption). Same body replays; changed body
          => 409.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Invalid or expired authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission or consent denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or inaccessible owned resource (conceals other-patient
            existence)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, version, idempotency or stale recommendation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request/schema/domain bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited; honor Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal failure; sanitized Error only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider or infrastructure unavailable; no success implied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: BODY_TOO_LARGE; reject without retaining text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-permission: authenticated; patient role only; clinician role provisioned out
        of band
      x-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
