        required: true
        schema:
          type: string
          format: uuid
        description: Actor+method+canonical path+key, canonical request hash; retain
          non-secret outcomes 24h (demo assumption). Same body replays; changed body
          => 409.
  /v1/companion/daily-checkin:
    post:
      operationId: submitDailyCheckin
      summary: submitDailyCheckin
      security:
      - supabaseJWT: []
      x-permission: authenticated patient UI only; no model writes
      responses:
        '200':
          description: Current patient companion state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionContext'
        '401':
          description: Invalid or expired authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission or consent denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or inaccessible owned resource (conceals other-patient
            existence)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, version, idempotency or stale recommendation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request/schema/domain bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyCheckinSubmit'
      x-feature-flag: RE_COMPANION_V2_ENABLED
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Actor+method+canonical path+key, canonical request hash; retain
          non-secret outcomes 24h (demo assumption). Same body replays; changed body
          => 409.
