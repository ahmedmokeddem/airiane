  /v1/conversation-sessions/{session_id}/messages:
    post:
      operationId: ingestMessages
      summary: ingestMessages
      description: V1 normalized ElevenLabs user/agent text events only. connection_id
        and allocated connection_epoch must match the owned provider connection. Active
        transcript grant required at ingestion; accept bounded late final messages
        from a closed connection only with event time at/before recorded close and
        current consent. No provider audio-history download, camera bytes, image/video
        URIs or hidden text retention.
      security:
      - supabaseJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
