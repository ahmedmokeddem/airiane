          - energy
          - sleep_hours
          - activity_completions
          - activity_rating
        unit:
          type: string
          enum:
          - scale_0_10
          - hours
          - count
          - scale_1_5
        count:
          type: integer
          minimum: 0
        mean:
          anyOf:
          - type: number
          - type: 'null'
        delta:
          anyOf:
          - type: number
          - type: 'null'
        coverage:
          type: string
          minLength: 1
          maxLength: 200
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
          maxItems: 500
