        note:
          type: string
          minLength: 1
          maxLength: 500
        citations:
          type: array
          items:
            type: string
            format: uri
          maxItems: 10
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              question_id:
                type: string
                minLength: 1
                maxLength: 80
              wording:
                type: string
                minLength: 1
                maxLength: 500
              minimum:
                type: integer
              maximum:
                type: integer
