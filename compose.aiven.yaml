# Runtime application discovery only. Configure all credentials in Console as secrets.
# Each Dockerfile can also be selected independently with repository-root build context.
services:
  airiane-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RE_ENVIRONMENT: production
      RE_DEMO_AUTH: "false"
      PORT: "8000"
  airiane-portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORTAL_DATA_MODE: api
      PORTAL_DEMO_AUTH: "false"
      PORT: "3000"
