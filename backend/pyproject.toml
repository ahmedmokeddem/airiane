[project]
name = "re-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "httpx>=0.28,<1", "pyjwt[crypto]>=2.10,<3", "pyyaml>=6,<7", "jsonschema>=4.23,<5", "pydantic-settings>=2.7,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
